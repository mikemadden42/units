version: "2"

linters:
  default: none
  enable:
    - errcheck # unchecked errors, e.g. file.Close
    - gosec # security issues, e.g. G304
    - revive # missing doc comments and style
    - govet # standard Go vetting
  exclusions:
    paths:
      - third_party
      - builtin
      - examples

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mikemadden42
